# Builds rkdl's wheels and sdist; a push of a v* tag also publishes them to PyPI (trusted publishing, `pypi`
# environment). Run it by hand (workflow_dispatch) for a dry run: everything but the publish job.
# Started from `maturin generate-ci github`.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release/0.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    # LICENSE-THIRD-PARTY, generated from Cargo.lock for every build so it's never stale. Fails on a dependency whose
    # license isn't accepted in about.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-about@0.9.3
      - run: python3 scripts/third_party_licenses.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: third-party-licenses
          path: LICENSE-THIRD-PARTY

  wheels:
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-latest, target: x86_64 }
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos, runner: macos-15-intel, target: x86_64 }
          - { os: macos, runner: macos-latest, target: aarch64 }
          - { os: windows, runner: windows-latest, target: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: third-party-licenses
      # abi3-py311 (Cargo.toml) makes this one wheel per platform for every Python from 3.11 on.
      - uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          # manylinux2014 on Linux; ignored elsewhere.
          manylinux: auto
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Smoke test
        shell: bash
        # In dist/, where the only importable rkdl is the wheel's.
        working-directory: dist
        run: >-
          uv run --isolated --no-project --python 3.11 --with "./$(ls *.whl)"
          python -c "import rkdl; print(rkdl.parse('a 1').children[0].args[0])"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    needs: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: third-party-licenses
      - uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --out dist
      # The kdl-org/kdl submodule is CC BY-SA 4.0 and stays out (pyproject's exclude). The checkout above doesn't fetch
      # it, so this guards the exclude rule only if that changes; it's cheap either way.
      - name: Check the sdist has no spec tests
        run: "! tar tzf dist/*.tar.gz | grep -q 'tests/kdl-spec/.'"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Must match the trusted publisher registered on PyPI: this file, environment `pypi`.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the tag matches the version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.3
