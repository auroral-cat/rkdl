[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rkdl"
description = "Format-preserving KDL for Python, backed by kdl-rs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
# LICENSE-MIT, LICENSE-APACHE, and LICENSE-THIRD-PARTY when it's been generated (scripts/third_party_licenses.py;
# the release workflow always generates it).
license-files = ["LICENSE-*"]
dynamic = ["version"]
keywords = ["kdl", "config", "configuration", "parser", "format-preserving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/auroral-cat/rkdl"
Issues = "https://github.com/auroral-cat/rkdl/issues"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.1",
    "pytest",
    "ruff>=0.17.3",
]

[tool.maturin]
python-source = "python"
module-name = "rkdl._rkdl"
# The kdl-org/kdl submodule is CC BY-SA 4.0, and the sdist doesn't ship it. The spec tests skip without it.
# .github/ is the README's images and, on release branches, the release workflow: not needed to build.
exclude = [
    { path = "tests/kdl-spec/**/*", format = "sdist" },
    { path = ".github/**/*", format = "sdist" },
]

[tool.ruff]
line-length = 120
# The kdl-org/kdl submodule: not ours to lint.
extend-exclude = ["tests/kdl-spec"]

[tool.uv]
# The development install is a debug build, so the Python tests run with the debug-only checks on (the id-tree shape
# check after every edit). Only uv's builds see this; `maturin build --release` still builds release.
config-settings-package = { rkdl = { build-args = "--profile=dev" } }
# Rebuild the extension when the Rust side changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }, { file = "python/**/*.py" }]
